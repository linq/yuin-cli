name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after all checks (requires a version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Validate tag and project metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('Cargo.toml').read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)[1]
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['TAG_NAME'] == 'v' + version, 'Tag must match Cargo.toml'
              assert re.search(r'^license\s*=', text, re.M), 'Choose a project license before publishing'
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/verify-tui.py target/release/yuin --large-playlist
      - name: Create portable archive and optional macOS installer
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          if [ "$RUNNER_PLATFORM" = "macOS" ]; then
            python3 scripts/package.py --target "$TARGET" --binary target/release/yuin --pkg
          else
            python3 scripts/package.py --target "$TARGET" --binary target/release/yuin
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: yuin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: package
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: yuin-*
          merge-multiple: true
          path: dist
      - name: Verify artifacts and create formula
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          for checksum in pathlib.Path('dist').glob('*.sha256'):
              expected, name = checksum.read_text().strip().split(None, 1)
              assert hashlib.sha256((checksum.parent / name).read_bytes()).hexdigest() == expected
          PY
          license=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["license"])')
          python3 scripts/homebrew-formula.py --repository "https://github.com/$REPOSITORY" --version "${TAG_NAME#v}" --license "$license" --output dist/yuin.rb
      - name: Publish checked release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/* --verify-tag --notes-file packaging/RELEASE_NOTES.md --title "Yuin $TAG_NAME"
