[package]
name = "yuin-cli"
version = "0.1.0-dev"
edition = "2024"
authors = ["linq <fancylinq@gmail.com>"]
description = "Yuin in your terminal: a Rust CLI and TUI music player"
publish = false

[[bin]]
name = "yuin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
