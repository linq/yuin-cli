[package]
name = "yuin-cli"
version = "0.1.0"
edition = "2024"
authors = ["linq <fancylinq@gmail.com>"]
description = "Yuin in your terminal: a Rust CLI and TUI music player"
license = "Apache-2.0"
repository = "https://github.com/linq/yuin-cli"
publish = false

[[bin]]
name = "yuin"
path = "src/main.rs"

[dependencies]
aes = "0.9.4"
anyhow = "1"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
crossterm = "0.29"
directories = "6"
ecb = { version = "0.2.1", features = ["alloc", "block-padding"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
json5 = "1.3.7"
libc = "0.2.191"
md-5 = "0.11.0"
num-bigint = "0.5.1"
rand = "0.10.3"
ratatui = "0.30"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "stream", "blocking", "gzip", "rustls", "query"] }
rquickjs = { version = "0.14.0", features = ["macro"] }
rsa = { version = "0.9.10", features = ["pem"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v4", "serde", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }
